name: music_player
description: A personal Flutter music player that connects directly to Baidu Netdisk.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  just_audio: ^0.10.6
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
